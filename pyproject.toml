[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "llm-inspector"
version = "0.2.0"
description = "The htop for LLM inference. Measured. Not guessed."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [{ name = "Hela Saoudi", email = "" }]
keywords = ["llm", "gpu", "inference", "monitoring", "observability", "cli", "vllm", "ollama"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: System :: Monitoring",
]

dependencies = [
    "typer[all]>=0.12",
    "rich>=13.7",
    "pydantic>=2.7",
    "psutil>=5.9",
    "requests>=2.31",
    "python-dateutil>=2.9",
    "nvidia-ml-py>=12.535",
]

[project.optional-dependencies]
torch = ["torch>=2.2"]
dev = [
    "pytest>=8.2",
    "pytest-mock>=3.14",
    "pytest-cov>=5.0",
    "ruff>=0.4",
    "mypy>=1.10",
]

[project.scripts]
llminspect = "llm_inspector.cli:app"

[project.urls]
Homepage = "https://github.com/helasaoudi/llm-inspector"
Repository = "https://github.com/helasaoudi/llm-inspector"
"Bug Tracker" = "https://github.com/helasaoudi/llm-inspector/issues"

[tool.hatch.build.targets.wheel]
packages = ["llm_inspector"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"
